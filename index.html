<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JoJo's Bizarre Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background: linear-gradient(45deg,#3a0ca3,#7209b7,#c9184a);
background-size:300% 300%;
animation:bg 10s infinite alternate;
color:white;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:left}
100%{background-position:right}
}

/* NAV */

nav{
display:flex;
justify-content:space-between;
align-items:center;
background:black;
padding:15px 30px;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
color:#ff00ff;
font-weight:bold;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.menu a:hover{
color:#ffea00;
}

/* MENU MOBILE */

.hamburguer{
display:none;
font-size:28px;
cursor:pointer;
padding:4px 8px;
border:0;
background:transparent;
color:white;
line-height:1;
}

/* HERO */

.hero{
height:80vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:50px;
text-shadow:0 0 20px #ff00ff;
}

.hero button{
margin-top:20px;
padding:12px 25px;
border:none;
background:#ff0080;
color:black;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

.hero button:hover{
background:#ffea00;
color:black;
}

/* GALERIA */

.galeria{
padding:50px 20px;
text-align:center;
}

.stands{
padding:35px 20px;
text-align:center;
background:rgba(0,0,0,.25);
}

.stands p{margin-top:10px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:black;
border:0;
border-radius:15px;
color:white;
font:inherit;
text-align:center;
width:100%;
padding:0;
overflow:hidden;
transition:.4s;
cursor:pointer;
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 20px #fff;
}

.card:focus-visible,
.hamburguer:focus-visible,
.hero button:focus-visible{
outline:3px solid #ffea00;
outline-offset:4px;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:10px;
}

/* STAND */

#standEffect{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
font-size:80px;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
color:#ffea00;
text-shadow:0 0 40px #ff00ff;
transition:.5s;
}

/* PARTICULAS */

.particle{
position:fixed;
width:10px;
height:10px;
background:white;
border-radius:50%;
pointer-events:none;
animation:particle 1s linear;
}

@keyframes particle{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-200px);
opacity:0;
}
}

/* FOOTER */

footer{
background:black;
padding:20px;
text-align:center;
margin-top:40px;
}

/* ACESSIBILIDADE */

.sr-only{
position:absolute;
width:1px;
height:1px;
padding:0;
margin:-1px;
overflow:hidden;
clip:rect(0,0,0,0);
white-space:nowrap;
border:0;
}

.card[hidden]{display:none;}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation:none !important;
scroll-behavior:auto !important;
transition:none !important;
}
}

/* MOBILE */

@media(max-width:700px){

.menu{
display:none;
flex-direction:column;
background:black;
position:absolute;
top:60px;
right:0;
width:200px;
padding:20px;
}

.menu.active{
display:flex;
}

.hamburguer{
display:block;
}

.hero h1{
font-size:32px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">JOJO</div>

<button class="hamburguer" type="button" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false" onclick="menu()">☰</button>

<div class="menu" id="menu">
<a href="#inicio">Início</a>
<a href="#galeria">Personagens</a>
<a href="#stands">Stands</a>
</div>

</nav>

<section class="hero" id="inicio">

<h1>JoJo's Bizarre Adventure</h1>

<p>Escolha um personagem e libere seu Stand!</p>

<button onclick="stand()">ATIVAR STAND</button>

<br><br>

<button onclick="musica()">🎵 Música Tema</button>

</section>

<section class="galeria" id="galeria">

<h2>Personagens</h2>

<label for="buscaPersonagem" class="sr-only">Buscar personagem</label>
<input id="buscaPersonagem" type="search" placeholder="Buscar personagem..." autocomplete="off" aria-describedby="resultadoBusca" style="margin-top:20px;padding:12px 16px;width:min(100%,420px);border:2px solid #ff00ff;border-radius:10px;font-size:16px;">
<p id="resultadoBusca" role="status" aria-live="polite" style="margin-top:12px;">4 personagens encontrados</p>

<div class="grid" id="gradePersonagens">

<button class="card" type="button" aria-label="Ativar Stand de Jotaro Kujo" onclick="personagem('ORA ORA ORA')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTQvTL2UjHyvXHLM3yEjxPDY6UB3aLBMZZPukTyj6BBw&s=10" alt="Retrato de Jotaro Kujo" loading="lazy" decoding="async" width="400" height="250">
<h3>Jotaro Kujo</h3>
</button>

<button class="card" type="button" aria-label="Ativar Stand de Dio Brando" onclick="personagem('ZA WARUDO')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwNdPWTEAxIudRE6K4aXVIlc3O8B_Ak7FQn5d4u5PY1YwZxKUpbqMGn-A&s=10" alt="Retrato de Dio Brando" loading="lazy" decoding="async" width="400" height="250">
<h3>Dio Brando</h3>
</button>

<button class="card" type="button" aria-label="Ativar Stand de Giorno Giovanna" onclick="personagem('MUDA MUDA')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbsReXi2wnbjbK0H8n4_mS9AHW6HJJC8xmS4A4yPmuAg&s=10" alt="Retrato de Giorno Giovanna" loading="lazy" decoding="async" width="400" height="250">
<h3>Giorno Giovanna</h3>
</button>

<button class="card" type="button" aria-label="Ativar Stand de Josuke Higashikata" onclick="personagem('DORA DORA')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdjs0ziQheNAhfitjZYwgMwuLyCXQEHJJMeFVrJF18oA&s=10" alt="Retrato de Josuke Higashikata" loading="lazy" decoding="async" width="400" height="250">
<h3>Josuke Higashikata</h3>
</button>

</div>

</section>

<section class="stands" id="stands" aria-labelledby="tituloStands">
<h2 id="tituloStands">Stands</h2>
<p>Escolha um personagem na galeria para liberar seu Stand.</p>
</section>

<div id="standEffect" role="status" aria-live="polite" aria-atomic="true"></div>

<footer>
Site criado por um desocupado 😉
</footer>

<!-- YOUTUBE PLAYER -->

<div style="display:none;">
<iframe
id="player"
width="0"
height="0"
src=""
frameborder="0"
allow="autoplay">
</iframe>
</div>

<script>

let tocando=false
const prefereMovimentoReduzido=window.matchMedia("(prefers-reduced-motion: reduce)")

function musica(){

let player=document.getElementById("player")

if(!tocando){

player.src="https://www.youtube.com/embed/wtrFQLivuCg?autoplay=1"
tocando=true

}else{

player.src=""
tocando=false

}

}

function stand(){

let efeito=document.getElementById("standEffect")

efeito.innerText="ZA WARUDO"

efeito.style.opacity="1"

particles()

setTimeout(()=>{
efeito.style.opacity="0"
},1500)

}

function personagem(texto){

let efeito=document.getElementById("standEffect")

efeito.innerText=texto

efeito.style.opacity="1"

particles()

setTimeout(()=>{
efeito.style.opacity="0"
},1500)

}

function particles(){

if(prefereMovimentoReduzido.matches) return

document.querySelectorAll(".particle").forEach(function(p){p.remove()})

for(let i=0;i<30;i++){

let p=document.createElement("div")

p.className="particle"

p.style.left=Math.random()*100+"%"

p.style.top=Math.random()*100+"%"

document.body.appendChild(p)

setTimeout(()=>p.remove(),1000)

}

}

function atualizarMenu(aberto){

let m=document.getElementById("menu")
let botao=document.querySelector(".hamburguer")

m.classList.toggle("active",aberto)
botao.setAttribute("aria-expanded",aberto ? "true" : "false")
botao.setAttribute("aria-label",aberto ? "Fechar menu" : "Abrir menu")

}

function menu(){

let m=document.getElementById("menu")
let aberto=!m.classList.contains("active")

atualizarMenu(aberto)

if(aberto) m.querySelector("a").focus()

}

function fecharMenu(){

let m=document.getElementById("menu")

if(!m.classList.contains("active")) return

atualizarMenu(false)

}

document.querySelectorAll("#menu a").forEach(function(link){
link.addEventListener("click",fecharMenu)
})

document.addEventListener("keydown",function(event){

if(event.key==="Escape" && document.getElementById("menu").classList.contains("active")){
fecharMenu()
document.querySelector(".hamburguer").focus()
}

})

const buscaPersonagem=document.getElementById("buscaPersonagem")
const cardsPersonagens=Array.from(document.querySelectorAll("#gradePersonagens .card"))
const resultadoBusca=document.getElementById("resultadoBusca")

buscaPersonagem.addEventListener("input",function(){
const termo=buscaPersonagem.value.trim().toLocaleLowerCase("pt-BR")
let visiveis=0

cardsPersonagens.forEach(function(card){
const nome=card.querySelector("h3").textContent.toLocaleLowerCase("pt-BR")
const corresponde=nome.includes(termo)
card.hidden=!corresponde
if(corresponde) visiveis++
})

resultadoBusca.textContent=visiveis===1 ? "1 personagem encontrado" : visiveis+" personagens encontrados"
if(visiveis===0) resultadoBusca.textContent="Nenhum personagem encontrado. Tente outro nome."

})

</script>

</body>
</html>
