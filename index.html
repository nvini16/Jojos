<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JoJo's Bizarre Adventure</title>

<style>

html{
scroll-behavior:smooth;
scroll-padding-top:76px;
}

:root{
/* Paleta principal */
--color-purple-deep:#3a0ca3;
--color-purple:#7209b7;
--color-rose:#c9184a;
--color-magenta:#ff00ff;
--color-yellow:#ffea00;

/* Identidade visual dos efeitos de Stand */
--stand-jotaro:#48d9ff;
--stand-jotaro-glow:rgba(72,217,255,.28);
--stand-dio:#c58aff;
--stand-dio-glow:rgba(197,138,255,.3);
--stand-giorno:#ffd447;
--stand-giorno-glow:rgba(255,212,71,.3);
--stand-josuke:#ff79bd;
--stand-josuke-glow:rgba(255,121,189,.28);
--stand-custom:#7fffd4;
--stand-custom-glow:rgba(127,255,212,.25);
--color-pink:#ff0080;
--color-danger:#a30025;

/* Superfícies e texto */
--color-black:#000;
--color-white:#fff;
--color-card:#090909;
--color-panel-deep:#171020;
--color-panel:#1d1429;
--color-panel-dark:#120d1b;
--color-text-dark:#171717;
--color-neutral:#444;
--color-muted:#b9afc5;
--color-subtle:#c9c2d0;
--color-transparent:transparent;

/* Sobreposições e transparências */
--overlay-black-25:rgba(0,0,0,.25);
--overlay-black-28:rgba(0,0,0,.28);
--overlay-black-35:rgba(0,0,0,.35);
--overlay-white-05:rgba(255,255,255,.05);
--overlay-white-10:rgba(255,255,255,.1);
--overlay-white-20:rgba(255,255,255,.2);
--overlay-white-25:rgba(255,255,255,.25);
--overlay-white-30:rgba(255,255,255,.3);
--overlay-white-35:rgba(255,255,255,.35);
--overlay-yellow-07:rgba(255,234,0,.07);
--overlay-yellow-09:rgba(255,234,0,.09);
--overlay-yellow-16:rgba(255,234,0,.16);
--overlay-yellow-18:rgba(255,234,0,.18);
--overlay-yellow-50:rgba(255,234,0,.5);
--overlay-yellow-65:rgba(255,234,0,.65);
--overlay-magenta-07:rgba(255,0,255,.07);
--overlay-magenta-12:rgba(255,0,255,.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background: linear-gradient(45deg,var(--color-purple-deep),var(--color-purple),var(--color-rose));
background-size:300% 300%;
animation:bg 10s infinite alternate;
color:var(--color-white);
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:left}
100%{background-position:right}
}

/* NAV */

nav{
display:flex;
justify-content:space-between;
align-items:center;
background:var(--color-black);
padding:15px 30px;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
color:var(--color-magenta);
font-weight:bold;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:var(--color-white);
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.menu a:hover{
color:var(--color-yellow);
}

.menu a[aria-current="location"]{
color:var(--color-yellow);
text-shadow:0 0 10px var(--overlay-yellow-50);
}

/* Entrada suave das seções */
.reveal-pending{
opacity:0;
transform:translateY(28px);
transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);
}

.reveal-pending.is-visible{
opacity:1;
transform:translateY(0);
}

/* MENU MOBILE */

.hamburguer{
display:none;
font-size:28px;
cursor:pointer;
padding:4px 8px;
border:0;
background:var(--color-transparent);
color:var(--color-white);
line-height:1;
}

/* HERO */

.hero{
height:80vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:50px;
text-shadow:0 0 20px var(--color-magenta);
}

.hero button{
margin-top:20px;
padding:12px 25px;
border:none;
background:var(--color-pink);
color:var(--color-black);
font-size:18px;
border-radius:10px;
cursor:pointer;
}

.hero button:hover{
background:var(--color-yellow);
color:var(--color-black);
}

.busca-personagem{
margin-top:20px;
padding:12px 16px;
width:min(100%,420px);
border:2px solid var(--color-magenta);
border-radius:10px;
font-size:16px;
}

/* GALERIA */

.galeria{
padding:50px 20px;
text-align:center;
}

.stands{
padding:35px 20px;
text-align:center;
background:var(--overlay-black-25);
}

.stands p{margin-top:10px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:var(--color-black);
border:0;
border-radius:15px;
color:var(--color-white);
font:inherit;
text-align:center;
width:100%;
padding:0;
overflow:hidden;
transition:.4s;
cursor:pointer;
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 20px var(--color-white);
}

.card:focus-visible,
.hamburguer:focus-visible,
.hero button:focus-visible{
outline:3px solid var(--color-yellow);
outline-offset:4px;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:10px;
}

/* CARTÕES COM VIRADA E AÇÕES */

.card-scene{
position:relative;
display:flex;
flex-direction:column;
perspective:1000px;
min-height:360px;
}

.card-favorito{
position:absolute;
top:12px;
right:12px;
z-index:6;
display:grid;
place-items:center;
width:44px;
height:44px;
border:1px solid var(--overlay-white-35);
border-radius:50%;
background:var(--overlay-black-35);
color:var(--color-white);
font-size:1.7rem;
line-height:1;
backdrop-filter:blur(8px);
cursor:pointer;
transition:transform .2s,background .2s,color .2s,border-color .2s;
}

.card-favorito:hover{transform:scale(1.08);}
.card-favorito.is-favorito{
background:var(--color-yellow);
color:var(--color-text-dark);
border-color:var(--color-yellow);
}
.card-favorito:focus-visible{
outline:3px solid var(--color-yellow);
outline-offset:3px;
}

.card-stand-externo{
width:100%;
margin-top:12px;
padding:11px 14px;
border:0;
border-radius:9px;
background:var(--color-pink);
color:var(--color-text-dark);
font:inherit;
font-weight:bold;
cursor:pointer;
transition:filter .2s,transform .2s;
}

.card-stand-externo:hover{
filter:brightness(1.12);
transform:translateY(-2px);
}

.card-stand-externo:focus-visible{
outline:3px solid var(--color-yellow);
outline-offset:3px;
}

.card-flipper{
position:relative;
width:100%;
height:310px;
transform-style:preserve-3d;
transition:transform .65s ease;
}

.card-scene.virado .card-flipper{transform:rotateY(180deg);}

.card-face{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
border-radius:15px;
overflow:hidden;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
background:var(--color-card);
color:var(--color-white);
}

.card-frente{
display:flex;
flex-direction:column;
align-items:stretch;
cursor:pointer;
}

.card-frente img{
width:100%;
height:260px;
object-fit:cover;
}

.card-frente h3{padding:12px;}

.card-verso{
transform:rotateY(180deg);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:14px;
padding:18px;
border:1px solid var(--overlay-white-25);
background:linear-gradient(145deg,var(--color-panel-deep),var(--color-purple-deep));
}

.card-verso h3{font-size:20px;}

.card-verso button{
width:min(100%,190px);
padding:10px 14px;
border:0;
border-radius:8px;
font:inherit;
font-weight:bold;
cursor:pointer;
}

.card-editar{background:var(--color-yellow);color:var(--color-text-dark);}
.card-stand{background:var(--color-pink);color:var(--color-text-dark);}
.card-excluir{background:var(--color-danger);color:var(--color-white);}

.card-face button:focus-visible{
outline:3px solid var(--color-white);
outline-offset:-5px;
}

.card[hidden],.card-scene[hidden]{display:none;}

.filtros-galeria{
display:flex;
justify-content:center;
margin-top:14px;
}

.botao-filtro-favoritos{
padding:9px 15px;
border:1px solid var(--overlay-yellow-50);
border-radius:999px;
background:var(--overlay-black-25);
color:var(--color-white);
font:inherit;
font-weight:bold;
cursor:pointer;
transition:background .2s,color .2s,border-color .2s;
}

.botao-filtro-favoritos:hover,
.botao-filtro-favoritos.ativo{
background:var(--color-yellow);
border-color:var(--color-yellow);
color:var(--color-text-dark);
}

.botao-filtro-favoritos:focus-visible{
outline:3px solid var(--color-white);
outline-offset:3px;
}

@media(prefers-reduced-motion:reduce){
.card-flipper{transition:none;}
}

/* ADICIONAR PERSONAGEM */

.acoes-galeria{
display:flex;
justify-content:center;
margin-top:22px;
}

.botao-adicionar{
border:2px solid var(--color-yellow);
border-radius:10px;
padding:12px 20px;
background:var(--color-yellow);
color:var(--color-text-dark);
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.botao-adicionar:hover{background:var(--color-white);color:var(--color-text-dark);}

.botao-adicionar:focus-visible,
.formulario-personagem button:focus-visible,
.formulario-personagem input:focus-visible,
.fechar-formulario:focus-visible{
outline:3px solid var(--color-white);
outline-offset:4px;
}

.painel-formulario{
width:min(100% - 32px,560px);
margin:26px auto 0;
padding:clamp(18px,4vw,28px);
border:1px solid var(--overlay-white-35);
border-radius:18px;
background:linear-gradient(145deg,var(--color-panel),var(--color-panel-dark));
box-shadow:0 16px 42px var(--overlay-black-28);
text-align:left;
}

.painel-formulario[hidden]{display:none;}

.cabecalho-formulario{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
margin-bottom:24px;
}

.cabecalho-formulario h3{
font-size:1.2rem;
line-height:1.3;
}

.formulario-personagem{
display:grid;
gap:22px;
}

.campo-nome-personagem,
.campo-imagem-personagem{
display:grid;
gap:10px;
}

.formulario-personagem label{
font-weight:bold;
line-height:1.4;
}

.formulario-personagem input[type="text"]{
width:100%;
min-height:48px;
padding:13px 15px;
border:1.5px solid var(--overlay-white-30);
border-radius:10px;
background:linear-gradient(135deg,var(--overlay-white-10),var(--overlay-white-05));
color:var(--color-white);
font:inherit;
transition:border-color .2s,box-shadow .2s,background .2s;
}

.formulario-personagem input[type="text"]::placeholder{
color:var(--color-muted);
opacity:1;
}

.formulario-personagem input[type="text"]:hover{
border-color:var(--overlay-yellow-65);
}

.formulario-personagem input[type="text"]:focus-visible{
outline:none;
border-color:var(--color-yellow);
background:var(--overlay-yellow-07);
box-shadow:0 0 0 3px var(--overlay-yellow-18);
}

.campo-imagem-personagem{display:grid;gap:9px;}

.seletor-imagem{
position:relative;
display:grid;
place-items:center;
gap:9px;
min-height:154px;
padding:22px;
overflow:hidden;
border:1.5px dashed var(--overlay-yellow-65);
border-radius:14px;
background:linear-gradient(145deg,var(--overlay-yellow-09),var(--overlay-magenta-07));
color:var(--color-white);
text-align:center;
cursor:pointer;
transition:border-color .2s,background .2s,transform .2s;
}

.seletor-imagem:hover{
border-color:var(--color-yellow);
background:linear-gradient(145deg,var(--overlay-yellow-16),var(--overlay-magenta-12));
}

.seletor-imagem:focus-within{
outline:3px solid var(--color-white);
outline-offset:4px;
}

.icone-upload{
display:grid;
place-items:center;
width:42px;
height:42px;
border:1px solid var(--overlay-yellow-50);
border-radius:12px;
color:var(--color-yellow);
font-size:23px;
}

.texto-upload{font-weight:bold;}
.detalhe-upload{color:var(--color-subtle);font-size:.88rem;}
.nome-arquivo{max-width:100%;color:var(--color-yellow);font-size:.9rem;overflow-wrap:anywhere;}

.input-imagem-real{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
}

.preview-personagem{
display:block;
width:100%;
max-width:220px;
height:180px;
object-fit:contain;
padding:8px;
border:1px solid var(--overlay-white-20);
border-radius:12px;
background:var(--overlay-black-35);
}



.preview-personagem[hidden]{display:none;}

.acoes-formulario{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:4px;
}

.acoes-formulario button:disabled{
opacity:.65;
cursor:wait;
}

.acoes-formulario button,
.fechar-formulario{
border:0;
border-radius:8px;
padding:11px 16px;
font:inherit;
font-weight:bold;
cursor:pointer;
}

.salvar-personagem{background:var(--color-yellow);color:var(--color-text-dark);}
.cancelar-personagem,.fechar-formulario{background:var(--color-neutral);color:var(--color-white);}

.mensagem-formulario{min-height:1.4em;color:var(--color-yellow);}

/* STAND — revelação tipográfica e identidade visual por personagem */

#standEffect{
--stand-color:var(--color-yellow);
--stand-glow:var(--overlay-yellow-50);
position:fixed;
inset:0;
z-index:1200;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
overflow:hidden;
pointer-events:none;
visibility:hidden;
opacity:0;
color:var(--stand-color);
background:radial-gradient(ellipse at center,var(--stand-glow),transparent 68%);
text-align:center;
transition:opacity .22s ease,visibility .22s ease;
}

#standEffect.is-active{
visibility:visible;
opacity:1;
}

.stand-phrase{
position:relative;
z-index:2;
max-width:100%;
font-size:clamp(2.2rem,9vw,6.5rem);
font-weight:900;
line-height:1.12;
letter-spacing:.045em;
overflow-wrap:anywhere;
text-transform:uppercase;
-webkit-text-stroke:1px var(--stand-color);
color:var(--color-white);
text-shadow:0 0 8px var(--stand-color),0 0 24px var(--stand-color),0 0 54px var(--stand-glow);
}

.stand-letter{
display:inline-block;
opacity:0;
transform:translateY(-1.15em) rotateX(85deg) scale(.7);
transform-origin:top center;
animation:standLetterDrop .52s cubic-bezier(.16,.8,.25,1) forwards;
animation-delay:var(--letter-delay,0ms);
}

@keyframes standLetterDrop{
0%{opacity:0;transform:translate3d(0,-1.4em,0) rotateX(35deg) scale(.94);filter:blur(5px);}
100%{opacity:1;transform:translate3d(0,0,0) rotateX(0) scale(1);filter:blur(0);}
}

#standEffect::before,
#standEffect::after{
content:"";
position:absolute;
inset:12%;
border:2px solid var(--stand-color);
border-radius:50%;
opacity:0;
pointer-events:none;
}

#standEffect.fx-jotaro::before{
animation:impactRing .9s ease-out both;
}
#standEffect.fx-jotaro::after{
inset:22%;
border-style:dashed;
animation:impactRing .9s .12s ease-out both;
}

#standEffect.fx-dio::before{
inset:8%;
border-radius:0;
border-width:1px;
transform:rotate(45deg) scale(.2);
animation:timeFrame 1.35s ease-out both;
}
#standEffect.fx-dio::after{
inset:18%;
border-radius:0;
border-style:dashed;
transform:rotate(-45deg) scale(.2);
animation:timeFrame 1.35s .1s ease-out both;
}

#standEffect.fx-giorno::before{
inset:15%;
border-width:1px;
border-radius:42% 58% 62% 38%;
animation:lifeBloom 1.4s ease-out both;
}
#standEffect.fx-giorno::after{
inset:25%;
border-width:1px;
border-radius:58% 42% 38% 62%;
animation:lifeBloom 1.4s .16s ease-out both;
}

#standEffect.fx-josuke::before{
inset:10% 25%;
border-radius:12px;
border-style:dashed;
transform:rotate(0);
animation:repairPulse .8s ease-in-out both;
}
#standEffect.fx-josuke::after{
inset:25% 10%;
border-radius:12px;
border-style:dashed;
animation:repairPulse .8s .12s ease-in-out both;
}

@keyframes impactRing{
0%{opacity:0;transform:scale(.25);}
35%{opacity:.9;}
100%{opacity:0;transform:scale(1.35);}
}
@keyframes timeFrame{
0%{opacity:0;transform:rotate(45deg) scale(.15);}
45%{opacity:.9;}
100%{opacity:0;transform:rotate(135deg) scale(1.15);}
}
@keyframes lifeBloom{
0%{opacity:0;transform:scale(.2) rotate(-35deg);}
45%{opacity:.8;}
100%{opacity:0;transform:scale(1.2) rotate(35deg);}
}
@keyframes repairPulse{
0%{opacity:0;transform:scale(.65) rotate(0);}
35%{opacity:1;}
100%{opacity:0;transform:scale(1.1) rotate(12deg);}
}

/* Partículas específicas: impacto, fragmentos, pétalas e faíscas */

.stand-particle{
position:absolute;
z-index:1;
left:var(--particle-x);
top:var(--particle-y);
width:var(--particle-size);
height:var(--particle-size);
background:var(--stand-color);
box-shadow:0 0 12px var(--stand-color);
opacity:0;
animation:standParticle var(--particle-duration,1s) ease-out var(--particle-delay,0ms) both;
}

.fx-jotaro .stand-particle{
width:3px;
height:var(--particle-size);
border-radius:2px;
transform:rotate(var(--particle-angle));
}
.fx-dio .stand-particle{
clip-path:polygon(50% 0,100% 35%,70% 100%,0 65%);
transform:rotate(var(--particle-angle));
}
.fx-giorno .stand-particle{
border-radius:100% 0 100% 0;
transform:rotate(var(--particle-angle));
}
.fx-josuke .stand-particle{
width:var(--particle-size);
height:3px;
border-radius:2px;
box-shadow:0 0 10px var(--stand-color),0 0 10px var(--stand-color);
transform:rotate(var(--particle-angle));
}
.fx-custom .stand-particle{
border-radius:50%;
clip-path:polygon(50% 0,62% 36%,100% 50%,62% 64%,50% 100%,38% 64%,0 50%,38% 36%);
}

@keyframes standParticle{
0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--particle-angle)) scale(.35);}
18%{opacity:1;}
100%{opacity:0;transform:translate3d(var(--particle-drift),var(--particle-rise),0) rotate(calc(var(--particle-angle) + 150deg)) scale(1.1);}
}

@media(prefers-reduced-motion:reduce){
.stand-letter{opacity:1;transform:none;animation:none;}
#standEffect::before,#standEffect::after,.stand-particle{animation:none !important;display:none;}
}

/* FOOTER */

footer{
background:var(--color-black);
padding:20px;
text-align:center;
margin-top:40px;
}

/* ACESSIBILIDADE */

.sr-only{
position:absolute;
width:1px;
height:1px;
padding:0;
margin:-1px;
overflow:hidden;
clip:rect(0,0,0,0);
white-space:nowrap;
border:0;
}

.card[hidden]{display:none;}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation:none !important;
scroll-behavior:auto !important;
transition:none !important;
}
}

@media(prefers-reduced-motion:reduce){
.reveal-pending{
opacity:1;
transform:none;
}
}

/* MOBILE */

@media(max-width:700px){

.menu{
display:none;
flex-direction:column;
background:var(--color-black);
position:absolute;
top:60px;
right:0;
width:200px;
padding:20px;
}

.menu.active{
display:flex;
}

.hamburguer{
display:block;
}

.hero h1{
font-size:32px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">JOJO</div>

<button class="hamburguer" type="button" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false" onclick="menu()">☰</button>

<div class="menu" id="menu">
<a href="#inicio">Início</a>
<a href="#galeria">Personagens</a>
<a href="#stands">Stands</a>
</div>

</nav>

<section class="hero" id="inicio">

<h1>JoJo's Bizarre Adventure</h1>

<p>Escolha um personagem e libere seu Stand!</p>

<button onclick="stand()">ATIVAR STAND</button>

<br><br>

<button onclick="musica()">🎵 Música Tema</button>

</section>

<section class="galeria" id="galeria">

<h2>Personagens</h2>

<label for="buscaPersonagem" class="sr-only">Buscar personagem</label>
<input id="buscaPersonagem" type="search" placeholder="Buscar personagem..." autocomplete="off" aria-describedby="resultadoBusca" class="busca-personagem">
<p id="resultadoBusca" role="status" aria-live="polite" style="margin-top:12px;">4 personagens encontrados</p>
<div class="filtros-galeria">
<button class="botao-filtro-favoritos" id="alternarFiltroFavoritos" type="button" aria-pressed="false">☆ Mostrar favoritos</button>

<script>

let tocando=false
const prefereMovimentoReduzido=window.matchMedia("(prefers-reduced-motion: reduce)")

let temporizadorStand=null
const estilosStand={
"base-jotaro":{classe:"fx-jotaro",cor:"var(--stand-jotaro)",brilho:"var(--stand-jotaro-glow)",particulas:24},
"base-dio":{classe:"fx-dio",cor:"var(--stand-dio)",brilho:"var(--stand-dio-glow)",particulas:30},
"base-giorno":{classe:"fx-giorno",cor:"var(--stand-giorno)",brilho:"var(--stand-giorno-glow)",particulas:26},
"base-josuke":{classe:"fx-josuke",cor:"var(--stand-josuke)",brilho:"var(--stand-josuke-glow)",particulas:22},
"custom":{classe:"fx-custom",cor:"var(--stand-custom)",brilho:"var(--stand-custom-glow)",particulas:20}
}

function stand(){
personagem({nome:"Dio Brando",stand:"ZA WARUDO",chave:"base-dio"})
}

function personagem(registro){
const efeito=document.getElementById("standEffect")
const estilo=estilosStand[registro.chave] || estilosStand.custom
const frase=String(registro.stand || registro.nome || "STAND").trim()
if(!frase) return

if(temporizadorStand) clearTimeout(temporizadorStand)
efeito.className=""
efeito.replaceChildren()
efeito.style.setProperty("--stand-color",estilo.cor)
efeito.style.setProperty("--stand-glow",estilo.brilho)
efeito.classList.add(estilo.classe)

const texto=document.createElement("span")
texto.className="stand-phrase"
texto.setAttribute("aria-hidden","true")

Array.from(frase).forEach(function(letra,indice){
const caractere=document.createElement("span")
caractere.className="stand-letter"
caractere.textContent=letra===" " ? "\u00a0" : letra
caractere.style.setProperty("--letter-delay",(indice*48)+"ms")
texto.appendChild(caractere)
})
efeito.appendChild(texto)
efeito.setAttribute("aria-label",frase)
efeito.classList.add("is-active")

criarParticulasStand(efeito,estilo)

const duracao=Math.max(1900,frase.length*48+1250)
temporizadorStand=setTimeout(function(){
efeito.classList.remove("is-active")
temporizadorStand=setTimeout(function(){
efeito.replaceChildren()
efeito.className=""
},260)
},duracao)
}

function criarParticulasStand(efeito,estilo){
if(prefereMovimentoReduzido.matches) return
for(let i=0;i<estilo.particulas;i++){
const particula=document.createElement("span")
particula.className="stand-particle"
particula.style.setProperty("--particle-x",Math.random()*100+"%")
particula.style.setProperty("--particle-y",(25+Math.random()*60)+"%")
particula.style.setProperty("--particle-size",(5+Math.random()*15)+"px")
particula.style.setProperty("--particle-angle",Math.round(Math.random()*360)+"deg")
particula.style.setProperty("--particle-drift",(Math.random()*180-90)+"px")
particula.style.setProperty("--particle-rise",(-70-Math.random()*190)+"px")
particula.style.setProperty("--particle-delay",Math.round(Math.random()*220)+"ms")
particula.style.setProperty("--particle-duration",(850+Math.random()*650)+"ms")
efeito.appendChild(particula)
particula.addEventListener("animationend",function(){particula.remove()},{once:true})
}
}

function atualizarMenu(aberto){

let m=document.getElementById("menu")
let botao=document.querySelector(".hamburguer")

m.classList.toggle("active",aberto)
botao.setAttribute("aria-expanded",aberto ? "true" : "false")

}

function menu(){

let m=document.getElementById("menu")
let aberto=!m.classList.contains("active")

atualizarMenu(aberto)

if(aberto) m.querySelector("a").focus()

}

function fecharMenu(){

let m=document.getElementById("menu")

if(!m.classList.contains("active")) return

atualizarMenu(false)

}

document.querySelectorAll("#menu a").forEach(function(link){
link.addEventListener("click",fecharMenu)
})


// Navegação ativa e entrada progressiva das seções.
const secoesNavegacao=Array.from(document.querySelectorAll("#inicio,#galeria,#stands"))
const linksNavegacao=Array.from(document.querySelectorAll("#menu a"))

function marcarSecaoAtiva(id){
linksNavegacao.forEach(function(link){
if(link.getAttribute("href")==="#"+id){
link.setAttribute("aria-current","location")
}else{
link.removeAttribute("aria-current")
}
})
}

if("IntersectionObserver" in window){
const observadorNavegacao=new IntersectionObserver(function(entradas){
entradas.forEach(function(entrada){
if(entrada.isIntersecting) marcarSecaoAtiva(entrada.target.id)
})
},{rootMargin:"-20% 0px -65% 0px",threshold:0})
secoesNavegacao.forEach(function(secao){observadorNavegacao.observe(secao)})

if(!prefereMovimentoReduzido.matches){
const observadorEntrada=new IntersectionObserver(function(entradas,observador){
entradas.forEach(function(entrada){
if(entrada.isIntersecting){
entrada.target.classList.add("is-visible")
observador.unobserve(entrada.target)
}
})
},{threshold:.12})
secoesNavegacao.forEach(function(secao){
secao.classList.add("reveal-pending")
observadorEntrada.observe(secao)
})
}else{
secoesNavegacao.forEach(function(secao){secao.classList.add("is-visible")})
}
}else{
secoesNavegacao.forEach(function(secao){secao.classList.add("is-visible")})
}

document.addEventListener("keydown",function(event){

if(event.key==="Escape" && document.getElementById("menu").classList.contains("active")){
fecharMenu()
document.querySelector(".hamburguer").focus()
}

})

const abrirFormularioPersonagem=document.getElementById("abrirFormularioPersonagem")
const painelFormularioPersonagem=document.getElementById("painelFormularioPersonagem")
const formularioPersonagem=document.getElementById("formularioPersonagem")

const personagensIniciais=[
{chave:"base-jotaro",nome:"Jotaro Kujo",imagemUrl:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTQvTL2UjHyvXHLM3yEjxPDY6UB3aLBMZZPukTyj6BBw&s=10",stand:"ORA ORA ORA"},
{chave:"base-dio",nome:"Dio Brando",imagemUrl:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwNdPWTEAxIudRE6K4aXVIlc3O8B_Ak7FQn5d4u5PY1YwZxKUpbqMGn-A&s=10",stand:"ZA WARUDO"},
{chave:"base-giorno",nome:"Giorno Giovanna",imagemUrl:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbsReXi2wnbjbK0H8n4_mS9AHW6HJJC8xmS4A4yPmuAg&s=10",stand:"MUDA MUDA"},
{chave:"base-josuke",nome:"Josuke Higashikata",imagemUrl:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdjs0ziQheNAhfitjZYwgMwuLyCXQEHJJMeFVrJF18oA&s=10",stand:"DORA DORA"}
]
let urlPreviewPersonagem=null
let bancoPersonagens=null
let idPersonagemEditando=null
let favoritosPersonagens=new Set()
let somenteFavoritos=false
const chaveArmazenamentoFavoritos="jojos-favoritos-v1"

function abrirBancoPersonagens(){
return new Promise(function(resolve,reject){
const requisicao=indexedDB.open("jojos-personagens",2)
requisicao.onupgradeneeded=function(){
const banco=requisicao.result
if(!banco.objectStoreNames.contains("personagens")){
banco.createObjectStore("personagens",{keyPath:"id",autoIncrement:true})
}
}
requisicao.onsuccess=function(){resolve(requisicao.result)}
requisicao.onerror=function(){reject(requisicao.error)}
})
}

function acessarPersonagens(modo,operacao){
return new Promise(function(resolve,reject){
const transacao=bancoPersonagens.transaction("personagens",modo)
const store=transacao.objectStore("personagens")
const requisicao=operacao(store)
requisicao.onsuccess=function(){resolve(requisicao.result)}
requisicao.onerror=function(){reject(requisicao.error)}
})
}

function urlDaImagemPersonagem(registro){
if(registro.imagem instanceof Blob) return URL.createObjectURL(registro.imagem)
return registro.imagemUrl || ""
}

function chaveFavorito(registro){
return registro.chave || "custom:"+registro.id
}

function carregarFavoritos(){
try{
const salvos=JSON.parse(localStorage.getItem(chaveArmazenamentoFavoritos) || "[]")
if(Array.isArray(salvos)){
favoritosPersonagens=new Set(salvos.filter(function(chave){return typeof chave==="string" && chave.length<=100}))
}
}catch(erro){
console.warn("Não foi possível carregar os favoritos salvos:",erro)
favoritosPersonagens=new Set()
}
}

function salvarFavoritos(){
try{
localStorage.setItem(chaveArmazenamentoFavoritos,JSON.stringify(Array.from(favoritosPersonagens)))
}catch(erro){
console.warn("Não foi possível persistir os favoritos neste navegador:",erro)
}
}

function atualizarBotaoFavorito(botao,registro){
const ativo=favoritosPersonagens.has(chaveFavorito(registro))
botao.classList.toggle("is-favorito",ativo)
botao.setAttribute("aria-pressed",String(ativo))
botao.setAttribute("aria-label",(ativo ? "Remover " : "Adicionar ")+registro.nome+(ativo ? " dos favoritos" : " aos favoritos"))
botao.title=ativo ? "Remover dos favoritos" : "Adicionar aos favoritos"
botao.textContent=ativo ? "★" : "☆"
}

function alternarFavorito(registro,botao){
const chave=chaveFavorito(registro)
if(favoritosPersonagens.has(chave)) favoritosPersonagens.delete(chave)
else favoritosPersonagens.add(chave)
salvarFavoritos()
atualizarBotaoFavorito(botao,registro)
atualizarResultadoBusca()
}

function criarCardPersonagem(registro){
const cena=document.createElement("article")
cena.className="card-scene"
cena.dataset.personagemId=String(registro.id)
cena.dataset.favoritoKey=chaveFavorito(registro)

const virador=document.createElement("div")
virador.className="card-flipper"

const frente=document.createElement("button")
frente.className="card-face card-frente"
frente.type="button"
frente.setAttribute("aria-label","Virar cartão de "+registro.nome+" para ver opções")

const imagem=document.createElement("img")
const urlImagem=urlDaImagemPersonagem(registro)
imagem.src=urlImagem
imagem.alt="Retrato de "+registro.nome
imagem.loading="lazy"
imagem.decoding="async"
imagem.width=400
imagem.height=250
if(registro.imagem instanceof Blob){
imagem.addEventListener("load",function(){URL.revokeObjectURL(urlImagem)},{once:true})
}

const titulo=document.createElement("h3")
titulo.textContent=registro.nome
frente.append(imagem,titulo)

const verso=document.createElement("div")
verso.className="card-face card-verso"
verso.setAttribute("aria-label","Opções para "+registro.nome)
verso.inert=true

const tituloVerso=document.createElement("h3")
tituloVerso.textContent=registro.nome
const botaoEditar=document.createElement("button")
botaoEditar.type="button"
botaoEditar.className="card-editar"
botaoEditar.textContent="Editar personagem"
botaoEditar.addEventListener("click",function(){editarPersonagem(registro.id)})
const botaoStand=document.createElement("button")
botaoStand.type="button"
botaoStand.className="card-stand-externo"
botaoStand.textContent="Ativar Stand de "+registro.nome
botaoStand.addEventListener("click",function(){personagem(registro)})
const botaoFavorito=document.createElement("button")
botaoFavorito.type="button"
botaoFavorito.className="card-favorito"
atualizarBotaoFavorito(botaoFavorito,registro)
botaoFavorito.addEventListener("click",function(){alternarFavorito(registro,botaoFavorito)})
const botaoExcluir=document.createElement("button")
botaoExcluir.type="button"
botaoExcluir.className="card-excluir"
botaoExcluir.textContent="Excluir personagem"
botaoExcluir.addEventListener("click",function(){excluirPersonagem(registro.id,registro.nome)})

verso.append(tituloVerso,botaoEditar,botaoExcluir)
virador.append(frente,verso)
cena.append(virador,botaoFavorito,botaoStand)

function voltarFrente(){
cena.classList.remove("virado")
verso.inert=true
frente.inert=false
frente.focus()
}

frente.addEventListener("click",function(){
document.querySelectorAll(".card-scene.virado").forEach(function(card){
card.classList.remove("virado")
card.querySelector(".card-verso").inert=true
card.querySelector(".card-frente").inert=false
})
cena.classList.add("virado")
frente.inert=true
verso.inert=false
botaoEditar.focus()
})

verso.addEventListener("click",function(event){
if(event.target.closest("button")) return
voltarFrente()
})

verso.addEventListener("keydown",function(event){
if(event.key==="Escape"){
event.preventDefault()
voltarFrente()
}
})
return cena
}

async function renderizarPersonagens(){
const registros=await acessarPersonagens("readonly",function(store){return store.getAll()})
const ativos=registros.filter(function(registro){return !registro.excluido})
const chavesValidas=new Set(ativos.map(chaveFavorito))
let favoritosRemovidos=false
favoritosPersonagens.forEach(function(chave){
if(!chavesValidas.has(chave)){
favoritosPersonagens.delete(chave)
favoritosRemovidos=true
}
})
if(favoritosRemovidos) salvarFavoritos()
gradePersonagens.replaceChildren()
ativos.forEach(function(registro){gradePersonagens.appendChild(criarCardPersonagem(registro))})
atualizarResultadoBusca()
}

async function carregarPersonagensSalvos(){
try{
bancoPersonagens=await abrirBancoPersonagens()
const existentes=await acessarPersonagens("readonly",function(store){return store.getAll()})
const chaves=new Set(existentes.map(function(item){return item.chave}).filter(Boolean))
for(const base of personagensIniciais){
if(!chaves.has(base.chave)){
await acessarPersonagens("readwrite",function(store){return store.add(base)})
}
}
await renderizarPersonagens()
}catch(erro){
console.error("Não foi possível carregar os personagens:",erro)
mensagemFormularioPersonagem.textContent="O armazenamento local não está disponível neste navegador."
}
}

function atualizarResultadoBusca(){
const termo=buscaPersonagem.value.trim().toLocaleLowerCase("pt-BR")
const todosCards=Array.from(gradePersonagens.querySelectorAll(".card-scene"))
let visiveis=0
todosCards.forEach(function(card){
const nome=card.querySelector(".card-frente h3").textContent.toLocaleLowerCase("pt-BR")
const correspondeNome=nome.includes(termo)
const correspondeFavorito=!somenteFavoritos || favoritosPersonagens.has(card.dataset.favoritoKey)
const corresponde=correspondeNome && correspondeFavorito
card.hidden=!corresponde
if(corresponde) visiveis++
})
if(visiveis===0){
if(somenteFavoritos && favoritosPersonagens.size===0) resultadoBusca.textContent="Você ainda não adicionou personagens aos favoritos."
else if(somenteFavoritos && termo) resultadoBusca.textContent="Nenhum favorito corresponde à busca."
else if(somenteFavoritos) resultadoBusca.textContent="Nenhum personagem favoritado está disponível."
else resultadoBusca.textContent="Nenhum personagem encontrado. Tente outro nome."
return
}
if(somenteFavoritos) resultadoBusca.textContent=visiveis===1 ? "1 favorito encontrado" : visiveis+" favoritos encontrados"
else resultadoBusca.textContent=visiveis===1 ? "1 personagem encontrado" : visiveis+" personagens encontrados"
}

async function editarPersonagem(id){
try{

idPersonagemEditando=id
formularioPersonagem.reset()

urlPreviewPersonagem=URL.createObjectURL(registro.imagem)
previewNovoPersonagem.src=urlPreviewPersonagem
previewNovoPersonagem.hidden=false
}else if(registro.imagemUrl){
previewNovoPersonagem.src=registro.imagemUrl
previewNovoPersonagem.hidden=false
}
mensagemFormularioPersonagem.textContent="Selecione uma nova imagem apenas se quiser trocá-la."

abrirFormularioPersonagem.setAttribute("aria-expanded","true")
nomeNovoPersonagem.focus()
}catch(erro){
console.error("Não foi possível abrir a edição:",erro)
}
}

async function excluirPersonagem(id,nome){
if(!window.confirm('Excluir "'+nome+'" da galeria? Essa ação não pode ser desfeita.')) return
try{
const registro=await acessarPersonagens("readonly",function(store){return store.get(id)})
if(registro && registro.chave){registro.excluido=true;await acessarPersonagens("readwrite",function(store){return store.put(registro)})}
else{await acessarPersonagens("readwrite",function(store){return store.delete(id)})}
await renderizarPersonagens()
}catch(erro){
console.error("Não foi possível excluir o personagem:",erro)
mensagemFormularioPersonagem.textContent="Não foi possível excluir o personagem."
}
}

formularioPersonagem.addEventListener("submit",async function(event){
event.preventDefault()
const nome=nomeNovoPersonagem.value.trim()
const imagem=imagemNovoPersonagem.files[0]
if(!nome){
mensagemFormularioPersonagem.textContent="Informe o nome do personagem."
return
}
if(imagem && (!["image/jpeg","image/png","image/webp","image/gif"].includes(imagem.type) || imagem.size>limiteImagemPersonagem)){
mensagemFormularioPersonagem.textContent="A imagem precisa ser PNG, JPG, WEBP ou GIF de até 3 MB."
return
}
if(!idPersonagemEditando && !imagem){
mensagemFormularioPersonagem.textContent="Selecione uma imagem para o novo personagem."
return
}
botaoSalvarPersonagem.disabled=true
mensagemFormularioPersonagem.textContent="Salvando..."
try{
if(idPersonagemEditando){
const atual=await acessarPersonagens("readonly",function(store){return store.get(idPersonagemEditando)})
if(!atual) throw new Error("Personagem não encontrado.")
atual.nome=nome
if(imagem){
atual.imagem=imagem
delete atual.imagemUrl
}
await acessarPersonagens("readwrite",function(store){return store.put(atual)})
}else{
await acessarPersonagens("readwrite",function(store){
return store.add({nome:nome,imagem:imagem,criadoEm:new Date().toISOString(),stand:nome})
})
}
formularioPersonagem.reset()
limparPreviewPersonagem()
idPersonagemEditando=null
painelFormularioPersonagem.hidden=true
abrirFormularioPersonagem.setAttribute("aria-expanded","false")
abrirFormularioPersonagem.focus()
mensagemFormularioPersonagem.textContent="Alterações salvas."
buscaPersonagem.value=""
await renderizarPersonagens()
}catch(erro){
console.error("Não foi possível salvar o personagem:",erro)
mensagemFormularioPersonagem.textContent="Não foi possível salvar. Verifique o espaço disponível no navegador."
}finally{
botaoSalvarPersonagem.disabled=false
}
})

document.addEventListener("keydown",function(event){
if(event.key==="Escape"){
if(!painelFormularioPersonagem.hidden){
fecharFormularioNovoPersonagem()
}else{
const virado=document.querySelector(".card-scene.virado")
if(virado){
virado.classList.remove("virado")
virado.querySelector(".card-verso").inert=true
virado.querySelector(".card-frente").inert=false
virado.querySelector(".card-frente").focus()
}
}
}
})

window.addEventListener("beforeunload",limparPreviewPersonagem)

const buscaPersonagem=document.getElementById("buscaPersonagem")
const resultadoBusca=document.getElementById("resultadoBusca")
const alternarFiltroFavoritos=document.getElementById("alternarFiltroFavoritos")
buscaPersonagem.addEventListener("input",atualizarResultadoBusca)
alternarFiltroFavoritos.addEventListener("click",function(){
somenteFavoritos=!somenteFavoritos
alternarFiltroFavoritos.setAttribute("aria-pressed",String(somenteFavoritos))
alternarFiltroFavoritos.classList.toggle("ativo",somenteFavoritos)
alternarFiltroFavoritos.textContent=somenteFavoritos ? "★ Exibindo favoritos" : "☆ Mostrar favoritos"
atualizarResultadoBusca()
})
carregarFavoritos()
carregarPersonagensSalvos()

</script>
